<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--muted:#667085;--brand:#315efb;--brand2:#6d5dfc;--good:#0f9f6e;--warn:#b76e00;--danger:#b42318;--line:#e4e7ec;--soft:#eef2ff;--shadow:0 8px 28px rgba(16,24,40,.08)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;padding-bottom:92px}button,input,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;background:rgba(246,247,251,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,231,236,.9);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:22px}.pill{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--soft);color:#3346b3;font-weight:800}
.container{max-width:720px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900}.hero h1{font-size:30px;line-height:1.08;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:14px 16px;border-radius:14px;font-weight:900;width:100%}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 13px;border-radius:13px;font-weight:800}.secondary.active{border-color:#a7b3ff;background:#eef2ff;color:#3346b3}.ghost{border:0;background:#f2f4f7;color:#344054;padding:10px 12px;border-radius:12px;font-weight:800}.danger{color:var(--danger)}
.field{margin-bottom:13px}.field label{display:block;font-size:13px;color:#475467;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0}.check input{width:22px;height:22px;margin-top:1px}.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px}.big-num{font-size:42px;font-weight:950;line-height:1}.hr{height:1px;background:var(--line);margin:14px 0}.notice{padding:11px 12px;background:#fff8eb;border:1px solid #fedf89;border-radius:12px;color:#7a4b00;font-size:13px}.success{padding:11px 12px;background:#ecfdf3;border:1px solid #abefc6;border-radius:12px;color:#067647;font-size:13px}
.seg{display:flex;gap:7px;overflow:auto;padding-bottom:2px}.seg button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:12px;color:var(--ink)}.seg button.active{background:#eef2ff;border-color:#c7d2fe;color:#3346b3;font-weight:900}.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time-card{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fafbff}.time-card strong{display:block;font-size:17px;margin-bottom:6px}.time-stepper{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:7px}.time-stepper button{height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:20px}.time-stepper div{text-align:center;font-size:20px;font-weight:900}
.equipment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.eq{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;min-height:86px;position:relative}.eq.selected{border:2px solid #6f7fff;background:#eef2ff}.eq .emoji{font-size:25px;display:block;margin-bottom:5px}.eq .name{font-size:12px;font-weight:850}.eq .checkmark{position:absolute;right:6px;top:5px;font-size:13px;color:var(--brand);font-weight:950}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 8px}.section-title h3{margin:0}.section-icon{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#eef2ff;margin-right:7px}
.workout-card{border:1px solid var(--line);border-radius:16px;padding:13px;margin:9px 0;background:#fff}.exercise-title{font-size:17px;font-weight:900}.badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#f2f4f7;color:#475467}.type-badge{font-size:11px;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#3346b3;font-weight:850}.thumb{width:74px;height:74px;flex:0 0 74px;border-radius:14px;background:#f4f6ff;border:1px solid #e1e6ff;display:grid;place-items:center;overflow:hidden}.thumb svg{width:66px;height:66px}.exercise-head{display:flex;gap:11px;align-items:center}.exercise-head .grow{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px;padding:9px 10px}.details{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.details summary{font-weight:900;color:#344054}.list{padding-left:20px;margin-bottom:0}.list li{margin:7px 0}.visual-card{margin:12px 0;border:1px solid var(--line);background:#fafbff;border-radius:16px;padding:12px;text-align:center}.visual-card svg{width:100%;max-width:320px;height:170px}.setrow{display:grid;grid-template-columns:27px 1fr 1fr 40px;gap:7px;align-items:center;margin:7px 0}.setrow input,.setrow select{width:100%;min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}.setrow input[type=checkbox]{width:25px;height:25px}.feedback{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.feedback button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px}.feedback button.selected{border-color:#7c8cff;background:#eef2ff;color:#3447b8;font-weight:900}.coach-nav{display:flex;gap:8px;margin-top:14px}.coach-nav button{flex:1}.coach-card{min-height:420px}.timerline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.timerchip{padding:7px 9px;background:#f2f4f7;border-radius:999px;font-size:12px;font-weight:800}.plan-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.plan-box{padding:12px;background:#fafbff;border:1px solid var(--line);border-radius:14px}.plan-box strong{display:block;font-size:18px}.progress-row{margin:10px 0}.stat{padding:12px;background:#f9fafb;border-radius:14px}.stat strong{display:block;font-size:20px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:flex;align-items:flex-end}.sheet{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}.option{padding:12px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.hidden{display:none!important}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:11px 14px;border-radius:999px;z-index:70;max-width:88%;text-align:center;box-shadow:var(--shadow)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:30}.nav button{border:0;background:transparent;padding:7px 2px;color:#667085;font-size:12px}.nav button b{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--brand);font-weight:900}.install{font-size:13px}
@media(max-width:390px){.container{padding:12px}.card{border-radius:18px;padding:14px}.hero h1{font-size:27px}.equipment-grid{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr 1fr}.setrow{grid-template-columns:24px 1fr 1fr 34px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">F</div>ForgeFit</div><span class="pill" id="headerMode">Adaptive</span></header>
<main id="app"></main>
<nav class="nav"><button data-tab="today" class="active"><b>◉</b>Today</button><button data-tab="history"><b>▤</b>History</button><button data-tab="progress"><b>↗</b>Progress</button><button data-tab="settings"><b>⚙</b>Settings</button></nav>
<div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const EQUIPMENT=[
 {id:'bodyweight',name:'Bodyweight',icon:'🧍'}, {id:'db2',name:'2 lb dumbbells',icon:'🏋️'}, {id:'db3',name:'3 lb dumbbells',icon:'🏋️'},
 {id:'bands',name:'Bands',icon:'➰'}, {id:'chair',name:'Chair',icon:'🪑'}, {id:'mat',name:'Mat',icon:'🧘'},
 {id:'stairs',name:'Stairs',icon:'🪜'}, {id:'hill',name:'Hill',icon:'⛰️'}, {id:'gym',name:'Apartment gym',icon:'🏋️‍♀️'},
 {id:'counter',name:'Counter / wall',icon:'🧱'}, {id:'bench',name:'Bench',icon:'🛋️'}, {id:'anchor',name:'Band anchor',icon:'⚓'}
];
const EX=[
 {id:'band_press',name:'Standing Band Chest Press',type:'strength',p:'Chest',eq:['bands','anchor'],sets:3,reps:8,why:'Builds chest, shoulder, and triceps strength while staying upright.',steps:['Anchor the band securely behind you at chest height.','Stand tall with a staggered stance and brace gently.','Press the handles forward until your arms are nearly straight.','Return slowly and keep the band under control.'],tips:['Use a lighter band if your shoulders take over.'],visual:'bandpress'},
 {id:'incline_pushup',name:'Incline Push-Up',type:'strength',p:'Chest',eq:['bodyweight','counter'],sets:3,reps:8,why:'A joint-friendly upper-body press that is easy to scale.',steps:['Place hands on a stable counter or wall.','Walk feet back until your body forms a straight line.','Lower your chest toward the surface.','Press away smoothly.'],tips:['Higher hand position = easier.'],visual:'pushup'},
 {id:'db_press',name:'Standing Dumbbell Press',type:'strength',p:'Shoulders',eq:['db2','db3'],sets:3,reps:8,why:'Builds shoulder and triceps strength with light dumbbells.',steps:['Stand tall with dumbbells near your shoulders.','Brace your trunk without holding your breath.','Press overhead to a comfortable range.','Lower slowly.'],tips:['Use one dumbbell at a time if balance feels better.'],visual:'dbpress'},
 {id:'band_row',name:'Standing Resistance Band Row',type:'strength',p:'Back',eq:['bands','anchor'],sets:3,reps:10,why:'Strengthens the upper back and arms and supports posture.',steps:['Anchor the band at chest height.','Stand tall with arms extended.','Pull elbows back toward your ribs.','Return slowly without shrugging.'],tips:['Pause briefly when elbows reach your sides.'],visual:'bandrow'},
 {id:'sit_to_stand',name:'Chair Sit-to-Stand',type:'strength',p:'Legs',eq:['bodyweight','chair'],sets:3,reps:10,why:'Builds practical leg and hip strength for daily movement.',steps:['Sit near the front of a sturdy chair.','Place feet about hip-width apart.','Lean slightly forward and stand tall.','Sit back down with control.'],tips:['Use hands lightly on the chair if needed.'],visual:'chair'},
 {id:'stepup',name:'Low Step-Up',type:'strength',p:'Legs',eq:['stairs'],sets:2,reps:8,why:'Builds leg strength and balance using a low, stable step.',steps:['Face a low step and place one whole foot on it.','Press through that foot to stand up.','Bring the other foot up gently.','Step down with control and switch lead legs.'],tips:['Hold a railing for balance.'],visual:'step'},
 {id:'curl',name:'Dumbbell Curl',type:'strength',p:'Biceps',eq:['db2','db3'],sets:2,reps:10,why:'Adds focused arm strength with simple technique.',steps:['Stand tall with dumbbells by your sides.','Keep elbows close to your ribs.','Curl the weights upward.','Lower slowly.'],tips:['Avoid swinging.'],visual:'curl'},
 {id:'band_pullapart',name:'Band Pull-Apart',type:'strength',p:'Upper Back',eq:['bands'],sets:2,reps:10,why:'Targets upper back and rear shoulders with light resistance.',steps:['Hold the band at chest height.','Keep elbows soft.','Pull hands apart until the band approaches your chest.','Return slowly.'],tips:['Keep shoulders away from your ears.'],visual:'pullapart'},
 {id:'walk',name:'Brisk Walking',type:'cardio',p:'Cardio',eq:['bodyweight'],minutes:5,why:'Raises heart rate with low complexity and easy intensity control.',steps:['Start at an easy pace for about a minute.','Increase to a purposeful pace.','Keep shoulders relaxed and breathe steadily.','Slow down if you cannot speak in short sentences.'],tips:['Indoors marching can substitute if needed.'],visual:'walk'},
 {id:'hillwalk',name:'Hill Walk',type:'cardio',p:'Cardio',eq:['hill'],minutes:6,why:'Adds cardiovascular challenge without needing gym equipment.',steps:['Begin on flatter ground.','Walk uphill at a controlled pace.','Shorten your stride if the hill feels steep.','Recover on flat ground or while walking back down carefully.'],tips:['Choose a gentler slope if balance or breathing feels off.'],visual:'hill'},
 {id:'stairs_cardio',name:'Stair Intervals',type:'cardio',p:'Cardio',eq:['stairs'],minutes:5,why:'Provides short cardiovascular intervals using equipment already available.',steps:['Use a railing.','Step up and down at a comfortable rhythm for 30–60 seconds.','Recover standing or walking for 30–60 seconds.','Repeat as tolerated.'],tips:['Use the lowest step if needed.'],visual:'stairs'},
 {id:'march',name:'Standing or Seated Marches',type:'cardio',p:'Cardio',eq:['bodyweight','chair'],minutes:5,why:'An easy-to-control cardio option for lower-energy days.',steps:['Stand tall near a chair or sit upright.','Alternate lifting one knee at a time.','Swing arms naturally if comfortable.','Keep a pace that raises your heart rate without straining.'],tips:['Seated version is the easier alternative.'],visual:'march'}
];
const defaults={
 version:2,
 profile:{defaultStrength:20,defaultCardio:10,minStrength:3,maxStrength:5,protectTomorrow:true,
  homeEquipment:['bodyweight','db2','db3','bands','chair','mat','stairs','hill','counter','anchor'],bandColors:['Yellow','Green','Red']},
 readiness:{energy:'okay',soreness:'some',strengthMinutes:20,cardioMinutes:10,location:'Home'},
 todayEquipment:['bodyweight','db2','db3','bands','chair','mat','stairs','hill','counter','anchor'],
 prefs:{},workouts:[],movements:[],mode:'coach'
};
function clone(x){return JSON.parse(JSON.stringify(x))}
let S=(()=>{try{const old=JSON.parse(localStorage.getItem('forgefit')||'null');return old?migrate(old):clone(defaults)}catch{return clone(defaults)}})();
function migrate(old){const n=Object.assign(clone(defaults),old);n.profile=Object.assign(clone(defaults.profile),old.profile||{});n.readiness=Object.assign(clone(defaults.readiness),old.readiness||{});if(old.readiness?.minutes&&!old.readiness.strengthMinutes){const total=+old.readiness.minutes||30;n.readiness.strengthMinutes=Math.max(0,total-10);n.readiness.cardioMinutes=Math.min(10,total)}if(!Array.isArray(n.todayEquipment))n.todayEquipment=clone(defaults.todayEquipment);return n}
let tab='today',activeWorkout=null,coachIndex=0,startedAt=null;
function save(){localStorage.setItem('forgefit',JSON.stringify(S))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function totalMinutes(){return (+S.readiness.strengthMinutes||0)+(+S.readiness.cardioMinutes||0)}
function readinessScore(){let v=70;if(S.readiness.energy==='great')v+=15;if(S.readiness.energy==='low')v-=18;if(S.readiness.soreness==='none')v+=8;if(S.readiness.soreness==='aLot')v-=20;return Math.max(20,Math.min(100,v))}
function available(ex){return ex.eq.some(e=>S.todayEquipment.includes(e)) || (ex.eq.includes('bodyweight')&&S.todayEquipment.includes('bodyweight'))}
function equipmentName(id){return EQUIPMENT.find(e=>e.id===id)?.name||id}
function toggleEquipment(id){const i=S.todayEquipment.indexOf(id);if(i>=0)S.todayEquipment.splice(i,1);else S.todayEquipment.push(id);save();render()}
function stepTime(kind,delta){const key=kind==='strength'?'strengthMinutes':'cardioMinutes';S.readiness[key]=Math.max(0,Math.min(60,(+S.readiness[key]||0)+delta));save();render()}
function autoSplit(total){total=+total;S.readiness.strengthMinutes=Math.round(total*2/3/5)*5;S.readiness.cardioMinutes=Math.max(0,total-S.readiness.strengthMinutes);save();render()}
function requiredStrengthCount(mins){if(mins<=0)return 0;if(mins<=10)return 2;if(mins<=15)return 3;if(mins<=25)return 4;if(mins<=35)return 5;return 6}
function requiredCardioCount(mins){if(mins<=0)return 0;if(mins<=10)return 1;if(mins<=20)return 2;return 3}
function pickUnique(pool,count){const out=[];for(const e of pool){if(out.length>=count)break;if(!out.some(x=>x.id===e.id))out.push(e)}return out}
function generate(){if(totalMinutes()<=0){toast('Choose some strength or cardio time first.');return}
 const strengthPool=EX.filter(e=>e.type==='strength'&&available(e)&&S.prefs[e.id]!=='never');
 const cardioPool=EX.filter(e=>e.type==='cardio'&&available(e)&&S.prefs[e.id]!=='never');
 const sc=requiredStrengthCount(S.readiness.strengthMinutes),cc=requiredCardioCount(S.readiness.cardioMinutes);
 if(sc && strengthPool.length<2){toast('Select more strength equipment or bodyweight.');return}
 let strength=pickUnique(strengthPool.sort((a,b)=>(S.prefs[b.id]==='more')-(S.prefs[a.id]==='more')),Math.min(sc,strengthPool.length));
 let cardio=pickUnique(cardioPool,Math.min(cc,cardioPool.length));
 if(sc && strength.length===1 && S.readiness.strengthMinutes>=15){strength.push({...strength[0],id:strength[0].id+'_variation',name:strength[0].name+' (variation)'});}
 const strengthEach=strength.length?Math.max(3,Math.floor(S.readiness.strengthMinutes/strength.length)):0;
 const cardioEach=cardio.length?Math.max(3,Math.floor(S.readiness.cardioMinutes/cardio.length)):0;
 const exercises=[...strength.map(e=>makeWorkoutEx(e,strengthEach)),...cardio.map(e=>makeWorkoutEx(e,cardioEach))];
 activeWorkout={id:crypto.randomUUID(),date:new Date().toISOString(),title:'Strength + Cardio',strengthMinutes:+S.readiness.strengthMinutes,cardioMinutes:+S.readiness.cardioMinutes,exercises,mode:S.mode||'coach',status:'active'};coachIndex=0;startedAt=Date.now();render();scrollTo(0,0)}
function makeWorkoutEx(e,allotted){const x=clone(e);x.allotted=allotted;x.feedback='';if(x.type==='strength')x.setData=Array.from({length:x.sets||3},()=>({resistance:defaultResistance(x),reps:x.reps||8,done:false}));else x.setData=[{minutes:allotted||x.minutes||5,done:false}];return x}
function defaultResistance(e){if(e.eq.includes('bands'))return S.profile.bandColors?.[1]||'Green';if(e.eq.includes('db3'))return '3 lb';if(e.eq.includes('db2'))return '2 lb';return 'Bodyweight'}
function completedMinutes(){if(!activeWorkout)return 0;return activeWorkout.exercises.reduce((sum,e)=>{if(e.type==='cardio')return sum+(e.setData[0].done?e.setData[0].minutes:0);const done=e.setData.filter(s=>s.done).length;return sum+(e.setData.length?Math.round((e.allotted||4)*done/e.setData.length):0)},0)}
function remainingMinutes(){return Math.max(0,totalMinutes()-completedMinutes())}
function completeWorkout(partial=false){if(!activeWorkout)return;activeWorkout.status=partial?'partial':'complete';activeWorkout.completedAt=new Date().toISOString();activeWorkout.elapsedMinutes=startedAt?Math.max(1,Math.round((Date.now()-startedAt)/60000)):0;S.workouts.unshift(activeWorkout);save();activeWorkout=null;startedAt=null;toast(partial?'Partial workout saved':'Workout saved');render();scrollTo(0,0)}
function showModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function visualSVG(kind){const c='#315efb',s='#14213d',g='#dfe5ff';const base=(inner)=>`<svg viewBox="0 0 320 170" role="img" aria-label="Exercise illustration"><rect x="0" y="0" width="320" height="170" rx="18" fill="#f8f9ff"/><circle cx="160" cy="44" r="16" fill="${g}" stroke="${s}" stroke-width="4"/>${inner}</svg>`;
 const person=`<path d="M160 60 L160 112 M160 76 L125 95 M160 76 L195 95 M160 112 L135 150 M160 112 L185 150" stroke="${s}" stroke-width="8" stroke-linecap="round"/>`;
 if(kind==='bandpress')return base(person+`<path d="M125 95 L78 75 M195 95 L242 75" stroke="${c}" stroke-width="6"/><path d="M72 55 L72 128 M248 55 L248 128" stroke="#98a2b3" stroke-width="6"/>`);
 if(kind==='bandrow')return base(person+`<path d="M125 95 L82 96 M195 95 L238 96" stroke="${c}" stroke-width="6"/><path d="M75 62 L75 132 M245 62 L245 132" stroke="#98a2b3" stroke-width="6"/>`);
 if(kind==='pushup')return base(`<path d="M70 95 L70 145" stroke="#98a2b3" stroke-width="8"/><path d="M100 86 L205 112" stroke="${s}" stroke-width="10" stroke-linecap="round"/><circle cx="214" cy="115" r="14" fill="${g}" stroke="${s}" stroke-width="4"/><path d="M115 91 L75 104 M198 110 L230 145 M177 104 L202 145" stroke="${s}" stroke-width="7" stroke-linecap="round"/>`);
 if(kind==='chair')return base(`<path d="M92 92 L92 148 M92 118 L142 118 M142 118 L142 148" stroke="#98a2b3" stroke-width="7"/>${person}`);
 if(kind==='step'||kind==='stairs')return base(person+`<path d="M195 145 H270 V120 H240 V95 H210" fill="none" stroke="#98a2b3" stroke-width="8"/>`);
 if(kind==='walk'||kind==='hill')return base(person+`<path d="M35 150 Q120 125 180 145 T290 130" fill="none" stroke="#98a2b3" stroke-width="7"/>`);
 if(kind==='march')return base(`<path d="M160 60 L160 108 M160 76 L130 96 M160 76 L190 96 M160 108 L132 145 M160 108 L205 118" stroke="${s}" stroke-width="8" stroke-linecap="round"/><circle cx="160" cy="44" r="16" fill="${g}" stroke="${s}" stroke-width="4"/>`);
 if(kind==='dbpress'||kind==='curl')return base(person+`<circle cx="118" cy="90" r="9" fill="${c}"/><circle cx="202" cy="90" r="9" fill="${c}"/>`);
 return base(person+`<path d="M110 92 Q160 70 210 92" fill="none" stroke="${c}" stroke-width="6"/>`)}
function explanationModal(id){const e=activeWorkout?.exercises.find(x=>x.id===id)||EX.find(x=>x.id===id)||EX.find(x=>id.startsWith(x.id));if(!e)return;showModal(`<div class="eyebrow">Exercise explanation</div><h2>${e.name}</h2><div class="visual-card">${visualSVG(e.visual)}</div><p>${e.why}</p><h3>How to do it</h3><ol class="list">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${e.tips?.length?`<div class="notice"><b>Key cue:</b> ${e.tips.join(' ')}</div>`:''}<button class="primary" style="margin-top:14px" onclick="closeModal()">Got it</button>`)}
function alternatives(id){const current=activeWorkout.exercises.find(e=>e.id===id);if(!current)return;const pool=EX.filter(e=>e.type===current.type&&e.id!==current.id&&available(e));showModal(`<div class="eyebrow">${current.type==='strength'?'Strength':'Cardio'} alternatives</div><h2>Replace ${current.name}</h2><p class="muted small">Only ${current.type} choices are shown, using equipment you selected for today.</p>${pool.map(e=>`<div class="option"><div class="exercise-head"><div class="thumb">${visualSVG(e.visual)}</div><div class="grow"><b>${e.name}</b><div class="small muted">${e.why}</div></div></div><button class="secondary" style="width:100%;margin-top:9px" onclick="replaceExercise('${id}','${e.id}')">Use this ${current.type} exercise</button></div>`).join('')||'<div class="notice">No other matching alternatives are available with today\'s equipment.</div>'}<button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button>`)}
function replaceExercise(oldId,newId){const i=activeWorkout.exercises.findIndex(e=>e.id===oldId);const src=EX.find(e=>e.id===newId);if(i<0||!src)return;activeWorkout.exercises[i]=makeWorkoutEx(src,activeWorkout.exercises[i].allotted);closeModal();toast('Exercise replaced');render()}
function skipExercise(id){const e=activeWorkout.exercises.find(x=>x.id===id);if(!e)return;alternatives(id)}
function updateSet(ei,si,key,val){const s=activeWorkout.exercises[ei].setData[si];s[key]=key==='done'?val:key==='reps'?Math.max(0,+val||0):val;renderHeaderOnly()}
function setFeedback(ei,val){const e=activeWorkout.exercises[ei];e.feedback=val;if(e.type==='strength'){if(val==='tooHard'){e.setData.forEach(s=>{if(!s.done)s.reps=Math.max(5,s.reps-2)});toast('Remaining reps reduced')};if(val==='easy'){e.setData.forEach(s=>{if(!s.done)s.reps+=2});toast('Remaining reps increased')}}render()}
function renderHeaderOnly(){document.getElementById('headerMode').textContent=activeWorkout?`${remainingMinutes()} min left`:'Adaptive'}
function today(){return `<div class="container"><section class="card hero"><div class="eyebrow">Your adaptive coach</div><h1>Plan the workout you actually have time for.</h1><p class="muted">Choose strength and cardio separately, then ForgeFit fills each block with multiple exercises that match today’s equipment.</p></section>${activeWorkout?workoutView():builder()}<section class="card"><div class="row"><div><div class="eyebrow">Purposeful movement</div><h3 style="margin-bottom:0">Phone wasn’t with you?</h3></div><button class="secondary" onclick="movementModal()">Log movement</button></div><p class="small muted" style="margin-top:10px">Walking, stairs, hills, mobility, or another purposeful session still counts.</p></section><section class="card install"><b>Add ForgeFit to your iPhone:</b> open this GitHub Pages site in Safari → Share → <b>Add to Home Screen</b>.</section></div>`}
function builder(){return `<section class="card"><div class="row"><div><div class="eyebrow">Daily readiness</div><h2 style="margin-bottom:4px">How are you today?</h2></div><div class="big-num">${readinessScore()}</div></div><div class="bar"><span style="width:${readinessScore()}%"></span></div><div class="hr"></div><div class="field"><label>Energy</label><div class="seg">${['low','okay','great'].map(x=>`<button class="${S.readiness.energy===x?'active':''}" onclick="S.readiness.energy='${x}';save();render()">${x==='okay'?'Okay':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="field"><label>Soreness</label><div class="seg">${[['none','None'],['some','Some'],['aLot','A lot']].map(x=>`<button class="${S.readiness.soreness===x[0]?'active':''}" onclick="S.readiness.soreness='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div><h3>Choose today’s time</h3><div class="time-grid"><div class="time-card"><strong>💪 Strength</strong><div class="time-stepper"><button onclick="stepTime('strength',-5)">−</button><div>${S.readiness.strengthMinutes} min</div><button onclick="stepTime('strength',5)">+</button></div></div><div class="time-card"><strong>❤️ Cardio</strong><div class="time-stepper"><button onclick="stepTime('cardio',-5)">−</button><div>${S.readiness.cardioMinutes} min</div><button onclick="stepTime('cardio',5)">+</button></div></div></div><p class="small muted" style="margin-top:9px">Total planned time: <b>${totalMinutes()} minutes</b>. Suggested 30-min split: <button class="ghost" onclick="autoSplit(30)">20 strength + 10 cardio</button></p><div class="hr"></div><div class="section-title"><h3>Equipment available today</h3><button class="secondary" onclick="openEquipmentEditor()">Edit saved</button></div><div class="equipment-grid">${EQUIPMENT.map(e=>`<button class="eq ${S.todayEquipment.includes(e.id)?'selected':''}" onclick="toggleEquipment('${e.id}')">${S.todayEquipment.includes(e.id)?'<span class="checkmark">✓</span>':''}<span class="emoji">${e.icon}</span><span class="name">${e.name}</span></button>`).join('')}</div><div class="hr"></div><div class="field"><label>Workout view</label><div class="seg"><button class="${S.mode==='coach'?'active':''}" onclick="S.mode='coach';save();render()">Coach mode</button><button class="${S.mode==='full'?'active':''}" onclick="S.mode='full';save();render()">Full plan</button></div></div><button class="primary" onclick="generate()">Build today’s ${totalMinutes()}-minute workout</button></section>`}
function workoutView(){const w=activeWorkout;return `<section class="card"><div class="eyebrow">Today’s workout</div><div class="row"><h2 style="margin-bottom:5px">${w.strengthMinutes+w.cardioMinutes} min · 2 sections</h2><span class="pill">${w.mode==='coach'?'Coach':'Full'}</span></div><div class="plan-summary"><div class="plan-box"><strong>💪 Strength ${w.strengthMinutes} min</strong><span class="small muted">${w.exercises.filter(e=>e.type==='strength').length} exercises</span></div><div class="plan-box"><strong>❤️ Cardio ${w.cardioMinutes} min</strong><span class="small muted">${w.exercises.filter(e=>e.type==='cardio').length} activities</span></div></div><div class="timerline"><span class="timerchip">⏱ ${remainingMinutes()} min remaining</span><span class="timerchip">✓ ${completedMinutes()} min complete</span></div></section>${w.mode==='coach'?coachView(w):fullView(w)}<div class="container" style="padding-top:0"><button class="primary" onclick="completeWorkout(false)">Finish & save workout</button><button class="secondary" style="width:100%;margin-top:8px" onclick="completeWorkout(true)">Finish early & save partial</button><button class="secondary danger" style="width:100%;margin-top:8px" onclick="activeWorkout=null;startedAt=null;render()">Cancel workout</button></div>`}
function coachView(w){const i=Math.min(coachIndex,w.exercises.length-1),e=w.exercises[i];return `<div class="container" style="padding-top:0"><section class="card coach-card"><div class="row"><div><span class="type-badge">${e.type==='strength'?'💪 Strength':'❤️ Cardio'}</span> <span class="badge">${i+1} of ${w.exercises.length}</span></div><button class="secondary" onclick="alternatives('${e.id}')">Alternative</button></div><h2 style="font-size:27px;margin-top:14px">${e.name}</h2><div class="visual-card">${visualSVG(e.visual)}</div>${setHTML(e,i)}<div class="actions"><button class="secondary" onclick="explanationModal('${e.id}')">📘 Explanation</button><button class="secondary" onclick="alternatives('${e.id}')">↔ Alternative ${e.type}</button><button class="secondary" onclick="skipExercise('${e.id}')">Skip / replace</button></div>${e.type==='strength'?feedbackHTML(e,i):''}<div class="coach-nav"><button class="secondary" ${i===0?'disabled':''} onclick="coachIndex=Math.max(0,coachIndex-1);render()">Back</button><button class="secondary" ${i===w.exercises.length-1?'disabled':''} onclick="coachIndex=Math.min(${w.exercises.length-1},coachIndex+1);render()">Next</button></div></section></div>`}
function fullView(w){const strength=w.exercises.filter(e=>e.type==='strength'),cardio=w.exercises.filter(e=>e.type==='cardio');return `<div class="container" style="padding-top:0">${sectionHTML('💪','Strength',strength,w)}${sectionHTML('❤️','Cardio',cardio,w)}</div>`}
function sectionHTML(icon,title,arr,w){if(!arr.length)return '';return `<section class="card"><div class="section-title"><h3><span class="section-icon">${icon}</span>${title}</h3><span class="pill">${title==='Strength'?w.strengthMinutes:w.cardioMinutes} min</span></div>${arr.map(e=>{const i=w.exercises.indexOf(e);return `<div class="workout-card"><div class="exercise-head"><div class="thumb">${visualSVG(e.visual)}</div><div class="grow"><div class="exercise-title">${e.name}</div><span class="badge">${e.p}</span></div></div>${setHTML(e,i)}<div class="actions"><button class="secondary" onclick="explanationModal('${e.id}')">Explanation</button><button class="secondary" onclick="alternatives('${e.id}')">Alternative ${e.type}</button></div>${e.type==='strength'?feedbackHTML(e,i):''}</div>`}).join('')}</section>`}
function setHTML(e,ei){if(e.type==='cardio'){const s=e.setData[0];return `<div class="sets"><label class="check"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},0,'done',this.checked)"><span><b>${s.minutes} minutes</b><br><span class="small muted">Mark when complete</span></span></label></div>`}
 return `<div class="sets">${e.setData.map((s,si)=>`<div class="setrow"><b>${si+1}</b>${e.eq.includes('bands')?`<select aria-label="band" onchange="updateSet(${ei},${si},'resistance',this.value)">${(S.profile.bandColors||['Yellow','Green','Red']).map(c=>`<option ${s.resistance===c?'selected':''}>${c}</option>`).join('')}</select>`:`<select aria-label="resistance" onchange="updateSet(${ei},${si},'resistance',this.value)">${['Bodyweight','2 lb','3 lb','Gym weight'].map(c=>`<option ${s.resistance===c?'selected':''}>${c}</option>`).join('')}</select>`}<input aria-label="reps" type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},${si},'done',this.checked)"></div>`).join('')}<div class="small muted">Resistance / band · reps · ✓</div></div>`}
function feedbackHTML(e,ei){return `<div class="details"><b>How was that?</b><div class="feedback">${[['easy','Too easy'],['right','Just right'],['hard','Hard but doable'],['tooHard','Too hard']].map(x=>`<button class="${e.feedback===x[0]?'selected':''}" onclick="setFeedback(${ei},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function openEquipmentEditor(){showModal(`<div class="eyebrow">Saved home profile</div><h2>Equipment you own</h2><p class="muted small">Choose what belongs in your saved Home profile. Today’s quick selection can still be different.</p><div class="equipment-grid">${EQUIPMENT.map(e=>`<button class="eq ${S.profile.homeEquipment.includes(e.id)?'selected':''}" onclick="toggleSavedEquipment('${e.id}')">${S.profile.homeEquipment.includes(e.id)?'<span class="checkmark">✓</span>':''}<span class="emoji">${e.icon}</span><span class="name">${e.name}</span></button>`).join('')}</div><h3 style="margin-top:18px">Band colors</h3><div class="field"><label>Comma-separated colors / labels</label><input id="bandColors" value="${(S.profile.bandColors||[]).join(', ')}"></div><button class="primary" onclick="saveEquipmentEditor()">Save profile</button>`)}
function toggleSavedEquipment(id){const a=S.profile.homeEquipment,i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);save();openEquipmentEditor()}
function saveEquipmentEditor(){const v=document.getElementById('bandColors').value.split(',').map(x=>x.trim()).filter(Boolean);if(v.length)S.profile.bandColors=v;save();closeModal();render();toast('Equipment profile saved')}
function movementModal(){showModal(`<h2>Log movement</h2><div class="field"><label>Type</label><select id="mvtype"><option>Walk</option><option>Hill walk</option><option>Stairs</option><option>Mobility</option><option>Other purposeful movement</option></select></div><div class="field"><label>Minutes</label><input id="mvmin" type="number" value="20"></div><div class="field"><label>Optional note</label><input id="mvnote" placeholder="How it felt, route, etc."></div><button class="primary" onclick="logMovement()">Save movement</button>`)}
function logMovement(){S.movements.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),type:document.getElementById('mvtype').value,minutes:+document.getElementById('mvmin').value||0,note:document.getElementById('mvnote').value});save();closeModal();toast('Movement saved')}
function history(){return `<div class="container"><section class="card"><div class="eyebrow">History</div><h1>Your work counts.</h1><p class="muted">Completed and partial workouts, plus purposeful movement.</p></section>${S.workouts.length?S.workouts.map(w=>`<section class="card"><div class="row"><div><h3>${w.title}</h3><div class="small muted">${new Date(w.date).toLocaleString()} · ${w.status||'complete'}</div></div><span class="pill">${w.strengthMinutes||0}S + ${w.cardioMinutes||0}C</span></div><div class="small">${w.exercises.map(e=>e.name).join(' · ')}</div></section>`).join(''):'<div class="card muted">No workouts saved yet.</div>'}${S.movements.map(m=>`<section class="card"><h3>${m.type}</h3><div class="small muted">${new Date(m.date).toLocaleString()} · ${m.minutes} min</div>${m.note?`<p class="small">${m.note}</p>`:''}</section>`).join('')}</div>`}
function progress(){const total=S.workouts.length,mins=S.workouts.reduce((a,w)=>a+(w.strengthMinutes||0)+(w.cardioMinutes||0),0),partial=S.workouts.filter(w=>w.status==='partial').length;return `<div class="container"><section class="card"><div class="eyebrow">Progress</div><h1>Consistency over punishment.</h1><div class="grid3"><div class="stat"><strong>${total}</strong><span class="small muted">Workouts</span></div><div class="stat"><strong>${mins}</strong><span class="small muted">Planned min</span></div><div class="stat"><strong>${partial}</strong><span class="small muted">Partial saves</span></div></div></section><section class="card"><h3>What ForgeFit learns</h3><p class="small muted">Your exercise feedback, equipment, completed sets, and workout history are stored on this device so future sessions can be adjusted.</p></section></div>`}
function settings(){return `<div class="container"><section class="card"><div class="eyebrow">Your plan</div><h1>Personalized for you</h1><div class="grid2"><div class="field"><label>Default strength min</label><input type="number" value="${S.profile.defaultStrength}" onchange="S.profile.defaultStrength=+this.value;save()"></div><div class="field"><label>Default cardio min</label><input type="number" value="${S.profile.defaultCardio}" onchange="S.profile.defaultCardio=+this.value;save()"></div></div><div class="grid2"><div class="field"><label>Minimum strength days</label><input type="number" min="1" max="6" value="${S.profile.minStrength}" onchange="S.profile.minStrength=+this.value;save()"></div><div class="field"><label>Maximum strength days</label><input type="number" min="1" max="7" value="${S.profile.maxStrength}" onchange="S.profile.maxStrength=+this.value;save()"></div></div><label class="check"><input type="checkbox" ${S.profile.protectTomorrow?'checked':''} onchange="S.profile.protectTomorrow=this.checked;save()"><span><b>Protect tomorrow</b><br><span class="small muted">Avoid stacking too much lower-body work.</span></span></label></section><section class="card"><div class="section-title"><h3>Equipment profiles</h3><button class="secondary" onclick="openEquipmentEditor()">Edit</button></div><p class="small"><b>Home:</b> ${S.profile.homeEquipment.map(equipmentName).join(', ')}.</p><p class="small"><b>Bands:</b> ${(S.profile.bandColors||[]).join(', ')}.</p></section><section class="card"><h3>Exercise preferences</h3><p class="muted small">Choose how often you want each exercise offered.</p>${EX.map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f2f4f7"><span>${x.name}</span><select style="width:120px;padding:7px;border:1px solid var(--line);border-radius:9px" onchange="S.prefs['${x.id}']=this.value;save()"><option value="neutral" ${(S.prefs[x.id]||'neutral')==='neutral'?'selected':''}>Neutral</option><option value="more" ${S.prefs[x.id]==='more'?'selected':''}>More</option><option value="less" ${S.prefs[x.id]==='less'?'selected':''}>Less</option><option value="never" ${S.prefs[x.id]==='never'?'selected':''}>Never</option></select></div>`).join('')}</section><section class="card"><h3>Data</h3><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="if(confirm('Reset all ForgeFit data?')){localStorage.removeItem('forgefit');location.reload()}">Reset</button><p class="small muted" style="margin-top:10px">This GitHub Pages version stores workout data locally in Safari. It does not access HealthKit.</p></section></div>`}
function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ForgeFit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function render(){document.getElementById('headerMode').textContent=activeWorkout?`${remainingMinutes()} min left`:'Adaptive';document.getElementById('app').innerHTML=tab==='today'?today():tab==='history'?history():tab==='progress'?progress():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}render();
</script>
</body>
</html>
